name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test static site
        run: npm test

      - name: Prepare public artifact
        run: npm run prepare:pages

      - name: Verify GitHub Pages artifact
        run: |
          test -f dist/client/index.html
          test -n "$(find dist/client/_next/static/chunks -maxdepth 1 -name 'index-*.js' -print -quit)"
          test ! -e dist/client/documents
          test -z "$(find dist/client -type f -iname '*.pdf' -print -quit)"
          test ! -e dist/client/main-axis-demo.html
          test ! -e dist/client/portrait-lab

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
